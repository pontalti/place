server:
  port: 8080

spring:
  application:
    name: place

  threads:
    virtual:
      enabled: true

  jackson:
    serialization:
      indent-output: true

  flyway:
    enabled: true

  devtools:
    remote:
      secret: teste
    add-properties: true

  datasource:
    url: jdbc:h2:mem:pizza;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        naming:
          physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  h2:
    console:
      enabled: true
      path: /h2

logging:
  level:
    root: INFO
    com.demo.place: DEBUG
  file:
    name: logs/app.log
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

---

spring:
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origins: http://localhost:4200